name: Chromium browser audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-audit:
    name: Route, mobile and WCAG browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install app dependencies
        run: bun install --frozen-lockfile
      - name: Build production site
        run: bun run build
      - name: Verify X static pages and internal links
        run: python3 scripts/verify-x-microsite.py

      - name: Enforce production Content Security Policy
        run: node scripts/harden-dist.cjs
      - name: Run first-party security baseline
        run: node scripts/security-audit.cjs
      - name: Optimize production image before real browser tests
        run: |
          python3 -m venv .image-env
          .image-env/bin/python -m pip install -q --disable-pip-version-check Pillow==11.3.0
          .image-env/bin/python scripts/optimize-build-images.py
          .image-env/bin/python scripts/build-beihang-emblem.py
      - name: Install pinned browser-audit tools in an isolated folder
        run: |
          mkdir -p .audit
          npm install --prefix .audit --no-audit --no-fund --no-package-lock --no-save playwright@1.56.1 @axe-core/playwright@4.10.2
      - name: Install Chromium for browser testing
        run: ./.audit/node_modules/.bin/playwright install --with-deps chromium
      - name: Start built site and wait for its route
        run: |
          bunx vite preview --host 127.0.0.1 --port 4173 > /tmp/portfolio-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl --fail --silent --output /dev/null http://127.0.0.1:4173/rocky_202x/; then exit 0; fi
            sleep 1
          done
          cat /tmp/portfolio-preview.log
          exit 1
      - name: Audit routes, responsive layout, interactions, accessibility
        env:
          NODE_PATH: ${{ github.workspace }}/.audit/node_modules
        run: node scripts/browser-audit.cjs
      - name: Audit X language desktop/mobile views and accessibility
        env:
          NODE_PATH: ${{ github.workspace }}/.audit/node_modules
        run: node scripts/x-pages-browser-audit.cjs

      - name: Preserve screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit-${{ github.sha }}
          path: artifacts/browser-audit
          if-no-files-found: warn
          retention-days: 7
