name: Dependency security audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  production-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Resolve the actual Bun production dependencies
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Fail on published high/critical production dependency advisories
        run: bun audit --prod --audit-level=high
