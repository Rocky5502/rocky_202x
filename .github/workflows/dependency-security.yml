name: Dependency security audit

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

jobs:
  production-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify npm lockfile integrity without executing install scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Fail on published high/critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
