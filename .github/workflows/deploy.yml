name: Deploy Vite site to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # GitHub Pages must not publish a build that has failed type checks or tests.
      # Keep the gate in THIS workflow rather than depending on a parallel CI run.
      - name: Type-check site
        run: bunx tsc --noEmit -p tsconfig.app.json

      - name: Run regression tests
        run: bun run test

      - name: Build production assets
        run: bun run build
      - name: Enforce production Content Security Policy
        run: node scripts/harden-dist.cjs
      - name: Run first-party security baseline
        run: node scripts/security-audit.cjs

      - name: Optimize deployment portrait and enforce image budget
        run: |
          python3 -m venv .image-env
          .image-env/bin/python -m pip install -q --disable-pip-version-check Pillow==11.3.0
          .image-env/bin/python scripts/optimize-build-images.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    needs: build
    runs-on: ubuntu-latest

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
