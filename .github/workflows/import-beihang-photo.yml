name: Import Beihang spotlight photograph

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/import-beihang-photo.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Retrieve and verify author's original photograph
        run: |
          mkdir -p public/assets
          curl --fail --location --retry 3 --silent --show-error \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3JSarZl83B1cm62gMvnM8izZ2Dx/8286ec6c-03c4-474b-abc7-3db983837020.jpg' \
            --output public/assets/beihang-ai-explorer-oct-2026-original.jpg
          echo '000f44cdb1543e5497882ea5d255f8043a6fc69983d709321833b725eb365508  public/assets/beihang-ai-explorer-oct-2026-original.jpg' | sha256sum --check
      - name: Make fast, responsive display image
        run: |
          python3 -m pip install --quiet Pillow==11.3.0
          python3 - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          original = Path("public/assets/beihang-ai-explorer-oct-2026-original.jpg")
          target = Path("public/assets/beihang-ai-explorer-oct-2026.webp")
          with Image.open(original) as src:
              image = ImageOps.exif_transpose(src).convert("RGB")
              image.thumbnail((640, 860), Image.Resampling.LANCZOS)
              image.save(target, "WEBP", quality=48, method=6)
              print(f"Saved {image.width}×{image.height}, {target.stat().st_size:,} bytes")
              assert target.stat().st_size < 90000
          PY
      - name: Commit verified images to public repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/beihang-ai-explorer-oct-2026-original.jpg public/assets/beihang-ai-explorer-oct-2026.webp
          if git diff --cached --quiet; then
            echo "Already imported"
            exit 0
          fi
          git commit -m "assets: preserve October 2026 Beihang campus spotlight photograph"
          git push origin HEAD:main
