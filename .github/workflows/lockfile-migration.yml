# One-time controlled migration from two stale lockfiles to one Bun text lock.
# Triggered by adding this file; after completion it should be removed.
name: Migrate dependency lockfile (one-time)

on:
  push:
    branches: ["main"]
    paths: [".github/workflows/lockfile-migration.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lockfile-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Regenerate Bun's modern text lock from the existing pinned graph
        run: |
          bun install --save-text-lockfile --lockfile-only --ignore-scripts
          test -s bun.lock
          echo "Generated bun.lock ($(wc -c < bun.lock) bytes)"
      - name: Remove competing stale npm and binary Bun locks
        run: |
          git rm -f -- bun.lockb package-lock.json
          git add -- bun.lock
      - name: Verify the migrated dependency tree
        run: |
          bun install --frozen-lockfile
          bunx tsc --noEmit -p tsconfig.app.json
          bun run test
          bun run build
          node scripts/harden-dist.cjs
          node scripts/security-audit.cjs
      - name: Commit verified lockfile migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet && exit 0
          git commit -m "chore(deps): migrate to audited Bun text lock and remove stale duplicate locks"
          git push origin HEAD:main
