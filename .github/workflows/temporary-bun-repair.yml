# One-time self-contained repair runner. Remove from branch after results are reviewed.
# Limited to the owner's fixed maintenance branch, never pull requests or forks.
name: Temporary Bun dependency repair
on:
  push:
    branches: ["maintenance/homepage-quality-20261016"]
permissions:
  contents: write
concurrency:
  group: temporary-bun-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install frozen reviewed graph without package lifecycle scripts
        run: bun install --ignore-scripts --frozen-lockfile
      - name: Repair vulnerable packages within compatible ranges
        shell: bash
        run: |
          set +e
          bun audit fix --ignore-scripts > /tmp/bun-repair-log.txt 2>&1
          status=$?
          set -e
          cat /tmp/bun-repair-log.txt
          echo "BUN_AUDIT_FIX_STATUS=$status"
          if [ "$status" -gt 1 ]; then exit "$status"; fi
          bun install --ignore-scripts --frozen-lockfile
      - name: Validate repaired graph before committing
        run: |
          bunx tsc --noEmit -p tsconfig.app.json
          bun run test
          bun run build
          node scripts/harden-dist.cjs
          node scripts/security-audit.cjs
      - name: Re-audit repaired graph and preserve unresolved findings
        shell: bash
        run: |
          set +e
          bun audit --prod --audit-level=high > /tmp/bun-after-audit.txt 2>&1
          status=$?
          set -e
          cat /tmp/bun-after-audit.txt
          echo "BUN_REMAINING_AUDIT_EXIT=$status"
      - name: Commit ONLY validated dependency metadata when changed
        shell: bash
        run: |
          git add -- package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency metadata changed."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: apply compatible Bun security dependency repairs"
            git push origin HEAD:maintenance/homepage-quality-20261016
          fi
