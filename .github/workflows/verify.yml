name: Verify portfolio

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Type check
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Production build
        run: bun run build
      - name: Enforce production Content Security Policy
        run: node scripts/harden-dist.cjs
      - name: Run first-party security baseline
        run: node scripts/security-audit.cjs
      - name: Enforce deployed portrait image budget
        run: |
          python3 -m venv .image-env
          .image-env/bin/python -m pip install -q --disable-pip-version-check Pillow==11.3.0
          .image-env/bin/python scripts/optimize-build-images.py
      - name: Unit tests
        run: bun run test
